version: '3.8'

services:
  app:
    build: .
    image: agriconnect:latest
    container_name: agriconnect_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      BASE_URL: http://localhost:8080
      APP_VERSION: 1.0.0
      AT_USERNAME: sandbox
      AT_API_KEY: atsk_your_key_here
      AT_SENDER_ID: AgriConnect
      AT_USSD_CODE: "*384*0032#"
      DB_HOST: db
      DB_NAME: agriconnect
      DB_USER: agri
      DB_PASS: agri_secret
      MAIL_ADMIN_EMAIL: admin@mubeetech.com.ng
    volumes:
      - ./logs:/var/www/html/logs
      - ./uploads:/var/www/html/uploads
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: agriconnect_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: agriconnect
      MYSQL_USER: agri
      MYSQL_PASSWORD: agri_secret
    ports:
      - "3307:3306"
    volumes:
      - agri_db_data:/var/lib/mysql
      - ./database/agriconnect.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  agri_db_data: